<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>
  
  <!-- Simple character face -->
  <circle cx="24" cy="26" r="3" fill="white"/> <!-- Left eye -->
  <circle cx="40" cy="26" r="3" fill="white"/> <!-- Right eye -->
  <circle cx="24" cy="26" r="1.5" fill="black"/> <!-- Left pupil -->
  <circle cx="40" cy="26" r="1.5" fill="black"/> <!-- Right pupil -->
  
  <!-- Smile -->
  <path d="M 22 38 Q 32 46 42 38" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Direction indicator (arrow pointing up) -->
  <polygon points="32,12 28,20 36,20" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
</svg>
